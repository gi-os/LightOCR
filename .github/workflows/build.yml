name: Build & Release APK

# A push to the default branch cuts a real GitHub Release, so this workflow only ever
# runs somewhere that has already been proven to compile via check.yml on a throwaway
# branch. See check.yml for the compile-only safety net.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Signing is mandatory, never a silent unsigned fallback. Every one of the four
      # secrets has to be present or the build stops here -- an unsigned release would
      # break Obtainium updates for anyone who already installed a signed build.
      - name: Configure release signing
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::release signing secrets are missing -- refusing to build an unsigned release"
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Read version name
        id: ver
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VN" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK (workflow artifact only, never a release asset)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/LightOCR-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightOCR-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever drifts,
      # Obtainium updates fail with an opaque "Failure: Invalid", so pin it and fail loudly.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          RAW=$("$APKSIGNER" verify --print-certs out/*.apk)
          echo "$RAW"
          ACTUAL=$(echo "$RAW" \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' \r')
          EXPECTED=$(tr -d ' :\r\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          ACTUAL_NORM=$(echo "$ACTUAL" | tr -d ':' | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL_NORM"
          [ -n "$ACTUAL_NORM" ] && [ "$ACTUAL_NORM" = "$EXPECTED" ] \
            || { echo '::error::signing certificate drifted from signing-fingerprint.txt'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed inside
      # the zip. Ask the package what its icon is instead of grepping filenames -- the same
      # lookup Obtainium and the launcher use. A missing icon has shipped before.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      # Sanity check on the manifest: the camera permission and the SAF document-picker
      # contract this app relies on both have to actually be there.
      - name: Verify camera and document-picker contract
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions out/*.apk > perms.txt
          cat perms.txt
          grep -q "android.permission.CAMERA" perms.txt \
            || { echo '::error::CAMERA permission missing'; exit 1; }
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -q "launchable-activity" badging.txt \
            || { echo '::error::no launchable activity declared'; exit 1; }
          echo "manifest contract OK"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightOCR-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightOCR-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Scanner v${{ steps.ver.outputs.version }}
          files: out/LightOCR-v${{ steps.ver.outputs.version }}.apk
          body_path: RELEASE_NOTES.md
          make_latest: true
